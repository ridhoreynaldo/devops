# 00-gateway/nginx/nginx.conf
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Format log terstruktur (memudahkan parsing & debug) ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'uct=$upstream_connect_time uht=$upstream_header_time '
                    'urt=$upstream_response_time host=$host';
    access_log /var/log/nginx/access.log main;

    # --- Optimasi dasar ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Upload file (default nginx 1 MB). Vhost boleh menurunkan per aplikasi.
    client_max_body_size 50m;

    # --- Gzip ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # --- SSL global ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # ==============================================================
    # RATE LIMITING (zone global; dipakai di vhost dengan limit_req/limit_conn)
    # ==============================================================
    limit_req_zone  $binary_remote_addr zone=req_limit_per_ip:10m  rate=10r/s;   # umum
    limit_req_zone  $binary_remote_addr zone=login_per_ip:10m      rate=10r/m;   # form login (anti brute-force)
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Resolver DNS internal Docker — wajib untuk proxy_pass berbasis variabel:
    # nginx resolve upstream saat request (bukan saat start), jadi gateway
    # tetap jalan meski container aplikasi belum ada/belum deploy.
    resolver 127.0.0.11 valid=30s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}
