# 01-infra/postgres/postgresql.conf — PostgreSQL 16, container limit 1.5 GB.
# Skala: shared_buffers ≈ 25% RAM container, effective_cache_size ≈ 70%.
listen_addresses = '*'

# Koneksi dibatasi: PgBouncer (max_db_connections=60) yang menampung ribuan klien
max_connections = 70
superuser_reserved_connections = 3

# Memori
shared_buffers = 384MB
effective_cache_size = 1GB
work_mem = 8MB                      # per operasi sort/hash; 70 koneksi × beberapa operasi
maintenance_work_mem = 128MB
effective_io_concurrency = 200      # SSD

# WAL & checkpoint (lebih halus, lebih sedikit lonjakan I/O)
wal_compression = on
max_wal_size = 1GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9

# Planner untuk SSD
random_page_cost = 1.1

# Observability: query > 500 ms masuk log; statistik agregat via pg_stat_statements
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
log_min_duration_statement = 500
log_checkpoints = on
log_lock_waits = on
log_line_prefix = '%m [%p] %u@%d '

# Hygiene koneksi: transaksi menggantung dari aplikasi bug diputus
idle_in_transaction_session_timeout = 60000
statement_timeout = 0               # set per aplikasi bila perlu: ALTER ROLE app SET statement_timeout = '30s'

# Autovacuum lebih agresif untuk tabel yang sering update (log pesan, antrian)
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# Waktu & keamanan
log_timezone = 'Asia/Jakarta'
timezone = 'Asia/Jakarta'
password_encryption = scram-sha-256
