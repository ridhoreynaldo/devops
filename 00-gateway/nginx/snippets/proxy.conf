# 00-gateway/nginx/snippets/proxy.conf
# Standar proxy header + timeout untuk semua upstream aplikasi.
# Header "Host" sengaja TIDAK ada di sini: setiap location menentukan
# sendiri ($host vs $http_host) karena setup Mikrotik butuh $http_host.

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  443;

# Timeout: cukup longgar untuk request berat, tapi tidak menggantung selamanya.
proxy_connect_timeout 10s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;

# Jangan teruskan header bermasalah dari upstream ke klien.
proxy_hide_header X-Powered-By;
