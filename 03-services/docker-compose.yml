# 03-services — layanan pendukung yang bukan "aplikasi bisnis" (tidak punya repo sendiri).
# Aplikasi (wa-gateway, dsb.) ada di 04-apps sebagai repo terpisah — lihat docs/APPS.md.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  9router:
    # AI gateway/router open-source: satu endpoint OpenAI-compatible (port 20128)
    # untuk 40+ provider AI dengan fallback otomatis. Pin versi, bukan latest.
    image: decolua/9router:0.5.91
    container_name: service-9router
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${BIND_IP:-127.0.0.1}:20128:20128"   # akses via SSH tunnel; publik hanya jika PUBLIC_PORTS=1
    environment:
      - DATA_DIR=/app/data
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      # Password awal dashboard (hanya dipakai sebelum user set password sendiri)
      - INITIAL_PASSWORD=${NINEROUTER_PASSWORD:-}
    volumes:
      - ./9router/data:/app/data        # SQLite + token provider (di-ignore git)
    networks: [global-gateway-net]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20128/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }

networks:
  global-gateway-net:
    external: true
