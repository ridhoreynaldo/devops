; 01-infra/postgres/pgbouncer.ini
; Aplikasi konek ke infra_pgbouncer:5432 dengan user/database miliknya sendiri.
;
; Autentikasi: auth_query. PgBouncer login ke Postgres sebagai role rendah-hak
; `pgbouncer_auth` (satu-satunya entri di userlist.txt) dan mengambil verifier
; SCRAM user aplikasi dari fungsi pgbouncer.get_auth(). Menambah user/aplikasi
; baru = CREATE ROLE di Postgres saja (scripts/create-app-db.sh), file ini tidak disentuh.

[databases]
* = host=postgres-db port=5432

[pgbouncer]
listen_addr = *
listen_port = 5432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_dbname = postgres
auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)

; transaction mode: aplikasi WAJIB mematikan prepared statement
; (postgres.js prepare:false, Prisma ?pgbouncer=true, Laravel default aman).
pool_mode = transaction

; Kapasitas. max_connections Postgres = 70 → total koneksi server dibatasi 60.
max_client_conn = 1000
default_pool_size = 15
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 60

; Bersihkan state antar transaksi (penting di transaction mode)
server_reset_query = DISCARD ALL
server_idle_timeout = 600
server_lifetime = 3600
ignore_startup_parameters = extra_float_digits,options

; Konsol admin: psql -h infra_pgbouncer -U pgbouncer_auth pgbouncer -c 'SHOW POOLS;'  (make pgbouncer-stats)
admin_users = pgbouncer_auth
stats_users = pgbouncer_auth

; Log hemat CPU/disk
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 300
